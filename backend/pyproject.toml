[project]
name = "polymarket-edge"
version = "1.0.0"
description = "Automated Polymarket trading platform: market scanning, edge detection, AI analysis, risk management, execution, and backtesting."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
